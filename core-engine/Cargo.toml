[package]
name = "nve-validate"
version = "0.1.0"
edition = "2021"
description = "NVE Core Engine — Structural graph validator for branching narratives"

[[bin]]
name = "nve-validate"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
