[package]
name = "nve-validate"
version = "0.1.0"
edition = "2021"
description = "NVE Core Engine — Structural graph validator for branching narratives"

[[bin]]
name = "nve-validate"
path = "src/main.rs"

[dependencies]
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
